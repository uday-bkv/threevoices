# Issue No. 01 · October 2026 · Founding issue
# One conversational AI use case per domain: autism care, agriculture, industrial operations.
- id: c01
  category:
  - autism
  use_case: Social-skills practice
  place: USA
  new: false
  reported: 19 July 2026
  figure: 17% → 51%
  figure_note: appropriate empathetic replies in real conversations, before and after four weeks of practice
  headline: Autistic teens and adults practised empathetic replies with a chatbot coach
  who: 30 autistic people aged 11 to 35 in a Stanford randomised trial, and 3 young adults on a hospital internship
  paragraphs:
  - Imagine rehearsing a tricky conversation before it happens. Noora gives a short prompt, such as a colleague describing a stressful day. The learner identifies its tone, then practises a reply by speaking or typing. Noora gives immediate feedback and, when useful, suggests another response to try.
  - In a randomised trial, participants practised for about four weeks. Their appropriate empathetic replies in real video conversations rose from about 17% to 51%, while the waitlist group changed little. In a separate workplace study, three interns also improved in unprompted conversations with job coaches.
  quote: “Noora was not designed to be a ‘friend’ replacement.” Lynn Kern Koegel
  care: The trial compared Noora with a waitlist, not with human-led therapy, and the workplace study had three people. Long-term effects aren't known.
  stamp: Peer-reviewed · News
  links:
  - label: PsyPost, 19 Jul 2026
    url: https://www.psypost.org/stanford-scientists-ai-chatbot-helps-autistic-adults-improve-face-to-face-communication-studies-show/
  - label: Journal of Autism and Developmental Disorders (trial)
    url: https://link.springer.com/article/10.1007/s10803-025-06734-x
  trace:
    title: A practice partner with scripted, checked prompts
    area: Medical · Autism
    summary: A chatbot gives short, human-checked practice statements and instant feedback, so users can rehearse empathetic replies before real conversations.
    facts:
    - label: The problem
      text: Responding with empathy in conversation can be hard for some autistic people, and one-to-one coaching is costly.
    - label: AI used
      text: Noora, a chatbot from Stanford researchers. Its practice statements are pre-written and human-verified rather than generated freely.
    - label: What goes in
      text: The user's rating of a statement's tone, then their spoken or typed reply.
    - label: What comes out
      text: 'Immediate feedback: a celebration for a supportive reply, or a suggested better reply.'
    - label: Who checks it
      text: Researchers wrote and verified every prompt; independent raters scored real conversations.
    - label: How we know
      text: A randomised waitlist trial with 30 participants and a three-person workplace study.
    steps:
    - role: person
      text: The user opens Noora and reads a statement, for example someone describing a stressful day at work.
    - role: person
      text: They label it positive, negative or neutral, then answer by speaking or typing.
    - role: ai
      text: 'Noora judges the reply and responds at once: a celebration for a supportive answer, or a model reply to try next time.'
    - role: person
      text: They practise about ten statements a day, five days a week, for four weeks.
    - role: outcome
      text: Appropriate empathetic replies in real conversations rose from about 17% to 51%. 71% of users improved and 67% enjoyed it.
    worked: Keeping prompts scripted and verified avoids the risks of open-ended chat, and voice input let users practise the way they actually talk.
    limits: Compared only with a waitlist, small samples, and long-term effects unmeasured.
    github_url: ""
    demo_url: ""
    sources:
    - label: PsyPost
      url: https://www.psypost.org/stanford-scientists-ai-chatbot-helps-autistic-adults-improve-face-to-face-communication-studies-show/
    - label: JADD trial
      url: https://link.springer.com/article/10.1007/s10803-025-06734-x
    clinical: true
    tools:
    - label: Models
      text: Claude, GPT‑4o or Gemini to score replies, or a small open model such as Llama run locally with Ollama
    - label: Practice content
      text: A bank of statements written and reviewed by clinicians, stored as JSON or a spreadsheet
    - label: Speech
      text: Whisper for spoken replies; the browser's speech recognition for quick prototypes
    - label: Interface
      text: Streamlit or a simple web app that tracks progress per session
- id: c02
  category:
  - agriculture
  use_case: Farm records by voice
  place: Australia
  new: true
  reported: 12 October 2026
  figure: '20'
  figure_note: farms piloting the assistant, with more than 40 waiting to join
  headline: Australian farmers started doing their paperwork by voice note from the paddock
  who: Andrew Gill, a cotton, beef and sheep producer in central-west New South Wales, and other farms in a co-operative trial
  paragraphs:
  - A farm day rarely ends when the work is done: records still need to be written up. Regen Farmers Mutual is testing a conversational assistant on 20 farms so people can log jobs as they happen, using a voice note, photo or text from the paddock, machinery or livestock yards.
  - The assistant turns those updates into records and draft paperwork, learning each farm's names for paddocks, mobs and staff shorthand. Farmer Andrew Gill, for example, tracks where his sheep are and compares that information with satellite imagery to estimate remaining feed. The pilot has not yet reported measured time savings.
  quote: “For a lot of farming families, paperwork happens after the day's actual farming is finished.” Christophe Bur, co-director
  care: An early pilot with no measured results yet, such as hours saved.
  stamp: News
  links:
  - label: IT Brief Australia, 12 Oct 2026
    url: https://itbrief.com.au/story/australian-farms-test-ai-assistant-to-cut-paperwork
  trace:
    title: A voice-first farm record keeper
    area: Agriculture
    summary: Farmers say or snap what they did, and the assistant turns it into updated records and paperwork.
    facts:
    - label: The problem
      text: Compliance paperwork piles up after the working day. AI use in Australian agriculture is about 3%, against a 12% national average.
    - label: AI used
      text: A conversational assistant trialled by Regen Farmers Mutual, a farmer-owned co-operative.
    - label: What goes in
      text: Voice notes, photos and text sent from the field.
    - label: What comes out
      text: Updated treatment records, inventory and prepared documents.
    - label: Who checks it
      text: Farmers review the records and test the tool with the co-op in weekly “AI gym” sessions.
    - label: Connects to
      text: Existing farm management software, weather data, machinery, sensors and commodity data.
    steps:
    - role: person
      text: For example, after treating a mob of cattle a farmer records a quick voice note in the yards.
    - role: ai
      text: The assistant understands the farm's own names for paddocks and mobs.
    - role: ai
      text: It updates the treatment record, adjusts the medicine inventory and drafts the required documents.
    - role: person
      text: Farmers check the records and refine the tool in weekly sessions with the co-op.
    - role: outcome
      text: Records are kept as work happens. Andrew Gill matches sheep movements with satellite imagery to estimate feed.
    worked: It fits the farm day instead of adding screen time, and adapts to each farm's vocabulary.
    limits: An early pilot with no measured savings yet.
    github_url: ""
    demo_url: ""
    sources:
    - label: IT Brief Australia
      url: https://itbrief.com.au/story/australian-farms-test-ai-assistant-to-cut-paperwork
    clinical: false
    tools:
    - label: Capture
      text: WhatsApp Business Cloud API or a Telegram bot for voice notes and photos
    - label: Speech
      text: Whisper (or faster-whisper) for transcription, with a custom vocabulary of farm names
    - label: Understanding
      text: An LLM with structured (JSON) output that turns notes into records
    - label: Records and data
      text: PostgreSQL or Airtable, Open-Meteo for weather, and farm-software APIs where available
- id: c03
  category:
  - industrial
  use_case: LLM and XR industrial guidance
  place: European industrial pilot research
  new: false
  reported: 7 April 2025
  figure: XR prototype
  figure_note: The 2025 conference paper describes early industrial implementations, not a production factory deployment.
  headline: Researchers explored voice-guided XR help for industrial technicians
  who: University and industrial research teams in robotic assembly and infrastructure maintenance
  paragraphs:
  - Industrial technicians can lose time looking up instructions or contacting a remote expert. A 2025 conference paper proposes an XR and voice system that retrieves approved domain knowledge and guides a worker through a task.
  - The architecture combines an LLM chat engine, retrieval-augmented generation and hands-free XR interaction. Early examples include robotic assembly, smart infrastructure maintenance and aerospace component servicing.
  quote: ""
  care: This is an early research system. Its proposed benefits do not establish safety, reliability or productivity in a live factory or field environment.
  stamp: Research
  links:
  - label: arXiv paper, 7 Apr 2025
    url: https://arxiv.org/abs/2504.05527
  - label: IEEE DCOSS-IoT conference record
    url: https://doi.org/10.1109/DCOSS-IoT65416.2025.00158
  trace:
    title: Asking for hands-free industrial guidance
    area: Industrial and field operations
    summary: A technician speaks to an XR assistant that retrieves approved industrial knowledge and presents task guidance.
    facts:
    - label: The problem
      text: Technicians need current machine and maintenance knowledge while their hands are occupied or a subject expert is remote.
    - label: AI used
      text: The proposed architecture combines a retrieval-augmented LLM chat engine with an XR application and voice interaction.
    - label: What goes in
      text: A spoken natural-language question plus relevant task or machine context.
    - label: What comes out
      text: A spoken or on-screen response grounded in domain-specific industrial knowledge.
    - label: Who checks it
      text: Operators and maintenance specialists retain responsibility for confirming approved procedures.
    - label: How we know
      text: A conference paper describes the architecture, retrieval evaluation and early demonstrations across industrial use cases.
    steps:
    - role: person
      text: A technician asks a spoken question while working on a machine or following a repair procedure.
    - role: ai
      text: The XR application retrieves relevant approved guidance and prepares a context-aware response.
    - role: ai
      text: The assistant presents the answer in XR or by speech while the worker remains hands-free.
    - role: expert
      text: The worker compares the guidance with the approved procedure and confirms the next safe action.
    - role: outcome
      text: The proposed workflow can reduce delays without removing the technician's operational judgment.
    worked: Voice plus XR is useful when a worker cannot stop to type or repeatedly consult a manual.
    limits: Early demonstrations do not establish deployment safety, recognition reliability or quantified productivity gains.
    github_url: ""
    demo_url: ""
    sources:
    - label: arXiv conference paper
      url: https://arxiv.org/abs/2504.05527
    - label: IEEE conference DOI
      url: https://doi.org/10.1109/DCOSS-IoT65416.2025.00158
    clinical: false
    tools:
    - label: Speech capture
      text: Use a noise-resistant headset microphone with push-to-talk and a visible active-listening state.
    - label: Retrieval
      text: Index approved manuals and work instructions with citations, document versions and access controls.
    - label: Conversation engine
      text: Use a bounded RAG and tool-orchestration layer rather than open-ended operational commands.
    - label: XR interface
      text: Show the retrieved step on a tablet or headset with a manual fallback and explicit stop control.
    build_steps:
    - title: Choose a read-only task
      detail: Start with locating or summarising an approved manual step; prohibit machine control or bypass of safety procedures.
    - title: Build voice retrieval
      detail: Capture noisy headset audio, confirm ambiguous terms and retrieve only current approved documents.
    - title: Present and verify
      detail: Show the exact source passage and require technician review before any maintenance action.
    - title: Test in the work environment
      detail: Evaluate recognition under machinery noise and interruptions, including unfamiliar questions and missing documents.
