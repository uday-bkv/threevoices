# November 2026 issue: nine voice-AI cases, three per domain.
# Older research and pilots are marked new: false; publication dates stay in reported.
- id: c01
  category: [autism]
  use_case: Workplace conversation practice
  place: United States
  new: false
  reported: 4 April 2026
  figure: "3"
  figure_note: Three autistic young adults took part in the multiple-baseline study; this is a small study, not a population-wide result.
  headline: Autistic interns practised workplace conversations with an AI coach
  who: Three autistic young adults in an intensive vocational internship program
  paragraphs:
    - >-
      Researchers evaluated Noora, an AI conversational training tool, with three autistic young adults in a vocational internship program. Participants practised emotionally responsive verbal communication and received real-time AI feedback. Human-delivered conversation probes used workplace-relevant scenarios to check performance before, during, and after training. The researchers reported immediate improvements for all three participants, including in generalization and retention probes.
  quote: ""
  care: This was a three-participant multiple-baseline study, not a large randomized trial. It does not establish that an AI coach replaces an employment specialist or clinician.
  stamp: Peer-reviewed
  links:
    - label: Journal of Autism and Developmental Disorders, 4 Apr 2026
      url: https://link.springer.com/article/10.1007/s10803-026-07313-4
    - label: PsyPost, Noora studies and voice interface, 19 Jul 2026
      url: https://www.psypost.org/stanford-scientists-ai-chatbot-helps-autistic-adults-improve-face-to-face-communication-studies-show/
  trace:
    title: Rehearsing a workplace conversation
    area: Medical · Autism
    summary: A conversational training tool gives feedback as autistic interns practise verbal responses to workplace scenarios.
    facts:
      - { label: The problem, text: "Workplace social communication can be a barrier for some autistic adults, including responding to emotional cues." }
      - { label: AI used, text: "Noora, an AI-based conversational training tool; the paper reports real-time feedback during practice." }
      - { label: What goes in, text: "The participant practises a verbal response to a workplace-relevant conversation prompt." }
      - { label: What comes out, text: "Immediate AI-generated feedback during practice; researchers also used standardized human-delivered probes." }
      - { label: Who checks it, text: "The study team measured responses in human-delivered probes across baseline, intervention, generalization, and retention phases." }
      - { label: How we know, text: "A multiple-baseline single-case study with three participants reported immediate improvements for all three." }
    steps:
      - { role: person, text: "An intern practises a workplace-relevant conversation prompt in Noora." }
      - { role: person, text: "They give a verbal response and continue with regular practice sessions." }
      - { role: ai, text: "Noora returns real-time feedback on the practice response." }
      - { role: expert, text: "Researchers use human-delivered conversation probes to check performance outside the training interaction." }
      - { role: outcome, text: "All three participants showed immediate improvements in emotionally responsive verbal communication in the study." }
    worked: Practice was linked to workplace-relevant scenarios, and the researchers checked for generalization using human-delivered probes rather than relying only on app scores.
    limits: Small single-case study; the paper does not establish long-term employment outcomes or effectiveness for all autistic people.
    sources:
      - { label: Springer Nature study, url: "https://link.springer.com/article/10.1007/s10803-026-07313-4" }
      - { label: PsyPost report on Noora studies and spoken replies, url: "https://www.psypost.org/stanford-scientists-ai-chatbot-helps-autistic-adults-improve-face-to-face-communication-studies-show/" }
    clinical: true
    tools:
      - { label: Prototype audio, text: "A consent-based browser microphone or mobile recorder for spoken practice; this is a prototype recommendation, not a claim about Noora's implementation." }
      - { label: Speech processing, text: "An ASR component such as Whisper or an on-device recognizer can provide transcripts for review; do not score accent or speech style." }
      - { label: Feedback rubric, text: "A small, specialist-reviewed set of workplace scenarios and response examples can constrain feedback instead of open-ended advice." }
      - { label: Privacy, text: "Use encrypted storage, short retention, and participant-controlled deletion for any recorded practice audio." }
    build_steps:
      - { title: Co-design the scenarios, detail: "Work with autistic adults and employment specialists to define relevant, respectful practice situations and optional non-speech interaction." }
      - { title: Build a bounded coach, detail: "Create a small prompt library and a transparent feedback rubric; keep suggestions optional and avoid diagnosis or claims about a person's emotions." }
      - { title: Add speech access, detail: "Implement microphone capture, transcript correction, and a text alternative. Make recording opt-in and show when audio is being processed." }
      - { title: Evaluate with people, detail: "With ethics approval, compare practice feedback with blinded human ratings in realistic conversation probes; report sample size and limitations." }

- id: c02
  category: [autism]
  use_case: Home speech-recording research
  place: United States
  new: false
  reported: 14 April 2022
  figure: "79%"
  figure_note: Best reported classifier accuracy in the study's five-fold cross-validation; it is not clinical diagnostic accuracy.
  headline: Researchers tested machine learning on children's home speech recordings
  who: Stanford researchers and families of 58 children contributing recordings through the Guess What? mobile game
  paragraphs:
    - >-
      A Stanford research team compared machine-learning approaches for identifying autism-related patterns in child speech recorded at home. The dataset included 58 children (20 autistic and 38 neurotypical), with cellphone-recorded audio collected through the Guess What? mobile game. Researchers compared random forests built from audio features, a convolutional neural network on spectrograms, and fine-tuned wav2vec 2.0. In five-fold cross-validation, the convolutional network had the highest reported accuracy, 79%, for distinguishing the study's autism and neurotypical labels.
  quote: ""
  care: This was a research model evaluated on a small collected dataset, not a diagnostic service. The study included 20 autistic children and 38 neurotypical children, with a sex imbalance between groups; cross-validation does not show how a system would perform in a different population or clinical setting.
  stamp: Peer-reviewed
  links:
    - label: JMIR Pediatrics and Parenting, 14 Apr 2022
      url: https://pediatrics.jmir.org/2022/2/e35406
    - label: PubMed Central full text
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9052034/
  trace:
    title: Analysing speech recorded at home
    area: Medical · Autism
    summary: Researchers compared speech-audio classifiers using cellphone recordings collected in a natural home setting.
    facts:
      - { label: The problem, text: "Specialist autism assessments can be time-consuming; speech features are being studied as one possible source of supporting information." }
      - { label: AI used, text: "The paper compared random forests on extracted audio features, a spectrogram CNN, and fine-tuned wav2vec 2.0." }
      - { label: What goes in, text: "Cellphone-recorded child speech audio collected through the Guess What? mobile game." }
      - { label: What comes out, text: "A model classification of the study audio as autism or neurotypical; it is not a diagnosis." }
      - { label: Who checks it, text: "The paper reports researcher-led five-fold cross-validation; clinical interpretation remains with qualified professionals." }
      - { label: How we know, text: "The dataset included 58 children (20 autistic and 38 neurotypical); five-fold cross-validation reported 70%, 77%, and 79% accuracy for the compared models." }
    steps:
      - { role: person, text: "A family opts in to record a child's speech during the study's mobile-game activity." }
      - { role: ai, text: "Researchers extract audio features or spectrograms and run the candidate classifiers." }
      - { role: expert, text: "The research team evaluates predictions using cross-validation against the study labels." }
      - { role: outcome, text: "The study reports a highest accuracy of 79% for its CNN model, without establishing clinical readiness." }
    worked: The study used ordinary cellphone recordings rather than specialized recording equipment and compared several audio-model approaches.
    limits: Dataset cross-validation can overstate performance on new families; the paper does not establish a safe stand-alone screening or diagnostic tool.
    sources:
      - { label: JMIR article, url: "https://pediatrics.jmir.org/2022/2/e35406" }
      - { label: PubMed Central full text, url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9052034/" }
    clinical: true
    tools:
      - { label: Audio capture, text: "A study app can record prompted speech with explicit caregiver consent and an option to stop or delete recordings." }
      - { label: Feature extraction, text: "Librosa can calculate MFCC and related acoustic features for a reproducible research baseline." }
      - { label: Model comparison, text: "Scikit-learn and PyTorch support baseline classifiers and spectrogram models; model performance must be evaluated on held-out speakers." }
      - { label: Data governance, text: "Use pseudonymous identifiers, encrypted storage, restricted access, and a documented deletion schedule for children's audio." }
    build_steps:
      - { title: Define a research question, detail: "Specify whether the prototype studies speech patterns or communication access; do not frame it as an autism diagnostic test." }
      - { title: Collect consented audio, detail: "Co-design short, age-appropriate prompts with families and clinicians, and record only the audio needed for the approved study." }
      - { title: Compare baselines, detail: "Start with interpretable acoustic features and compare a speech model only on participant-separated train and test splits." }
      - { title: Validate and constrain, detail: "Report subgroup performance and uncertainty, obtain independent clinical review, and do not return diagnostic labels to families." }

- id: c03
  category: [autism]
  use_case: Structured vocal-response assessment research
  place: India
  new: false
  reported: 22 November 2023
  figure: "82"
  figure_note: Children with autism whose audio-visual responses were recorded in the described research framework.
  headline: An Indian research team explored automated analysis of children's vocal responses
  who: Researchers developing a machine-learning assessment framework using the Indian Scale for Assessment of Autism
  paragraphs:
    - >-
      A Springer book chapter describes a machine-learning framework for analysing children's vocal responses against speech-language and communication criteria in the Indian Scale for Assessment of Autism. The authors report recording audio-visual responses from 82 children with autism in supervised, computer-based sessions. The work is research into supporting structured assessment; it does not establish a clinically approved automated diagnosis.
  quote: ""
  care: The source describes a research framework and a supervised sample. Do not treat its model output as a diagnosis or infer general performance beyond the reported study.
  stamp: Research
  links:
    - label: Springer Nature book chapter, 22 Nov 2023
      url: https://link.springer.com/chapter/10.1007/978-3-031-48309-7_41
    - label: Crossref record
      url: https://api.crossref.org/works/10.1007/978-3-031-48309-7_41
  trace:
    title: Recording structured vocal responses
    area: Medical · Autism
    summary: A research framework applies machine learning to recorded vocal responses gathered during supervised assessment activities.
    facts:
      - { label: The problem, text: "Structured communication observations take specialist time and can be difficult to scale." }
      - { label: AI used, text: "A proposed machine-learning framework for automated analysis and recognition of vocal responses." }
      - { label: What goes in, text: "Audio-visual responses recorded in supervised computer-based sessions using assessment criteria from the Indian Scale for Assessment of Autism." }
      - { label: What comes out, text: "Research-model analysis intended to support assessment; the source does not establish an approved diagnostic product." }
      - { label: Who checks it, text: "Researchers describe supervised recordings and assessment criteria; qualified clinicians must retain diagnostic responsibility." }
      - { label: How we know, text: "The chapter reports audio-visual recordings from 82 children with autism." }
    steps:
      - { role: person, text: "A child takes part in a supervised, structured activity designed to elicit vocal responses." }
      - { role: ai, text: "The research framework analyses the recorded response against defined speech-language features." }
      - { role: expert, text: "A trained professional interprets the child's responses within the standardized assessment context." }
      - { role: outcome, text: "The chapter presents a machine-learning research approach, not a replacement for clinical assessment." }
    worked: Structured prompts and supervised recording give researchers a repeatable setting for studying vocal responses.
    limits: The chapter does not demonstrate autonomous diagnosis or establish performance across settings, languages, or unsupervised recordings.
    sources:
      - { label: Springer Nature chapter, url: "https://link.springer.com/chapter/10.1007/978-3-031-48309-7_41" }
      - { label: Crossref bibliographic record, url: "https://api.crossref.org/works/10.1007/978-3-031-48309-7_41" }
    clinical: true
    tools:
      - { label: Prompt capture, text: "A consented tablet recording flow can present a fixed prompt and capture speech with calibrated microphone settings." }
      - { label: Speech features, text: "Praat or openSMILE can extract acoustic features for research review; preserve the original audio for authorized auditing." }
      - { label: Model baseline, text: "Scikit-learn supports transparent exploratory classifiers; keep output as a research score, not a diagnostic label." }
      - { label: Clinical review, text: "A clinician-reviewed annotation protocol is needed to interpret communication in context and document uncertainty." }
    build_steps:
      - { title: Set the clinical boundary, detail: "Treat the work as a research aid only and agree with clinicians and autistic people which communication features are appropriate to study." }
      - { title: Prepare structured prompts, detail: "Use a small, approved prompt set and record only with consent, assent where appropriate, and a clear stop option." }
      - { title: Build an auditable baseline, detail: "Extract a small set of acoustic features and compare model output with expert annotations using participant-separated validation." }
      - { title: Review before any use, detail: "Check errors across language and communication profiles; keep predictions out of care decisions unless a validated clinical pathway is established." }

- id: c04
  category: [agriculture]
  use_case: Voice IVR agricultural advice
  place: Nigeria
  new: false
  reported: Undated IndiaAI use-case record, accessed 24 November 2026
  figure: IVR
  figure_note: The government use-case listing describes an interactive voice-response interface; no independently verified impact figure is displayed.
  headline: Nigerian smallholders can ask FarmAdvice crop questions by phone
  who: Crop2Cash's FarmAdvice service as described in an IndiaAI use-case record
  paragraphs:
    - >-
      An IndiaAI use-case record describes FarmAdvice as an IVR-based generative-AI advisory for Nigerian smallholder farmers. Farmers ask questions by voice in local dialects; the listing says the service transcribes the audio and returns contextual agricultural guidance grounded in an agronomy knowledge base. The listing reports a scaled service, but its user and performance figures are platform-reported rather than independently evaluated in the material reviewed here.
  quote: ""
  care: The IndiaAI page is a project description, not an independent evaluation. Treat its user counts, model-accuracy figures, and impact statements as unverified platform claims.
  stamp: Public body
  links:
    - label: IndiaAI, FarmAdvice use-case listing
      url: https://aikosh.indiaai.gov.in/home/use-cases/details/farmadvice_closing_the_1_50_000_extension_gap_via_voice_first_ai_advisory.html
  trace:
    title: Calling for local-language crop advice
    area: Agriculture
    summary: The project listing describes an IVR service that accepts spoken farmer questions and returns agronomy advice by voice.
    facts:
      - { label: The problem, text: "Smallholders may have limited access to extension workers and written or data-heavy advisory services." }
      - { label: AI used, text: "FarmAdvice is described by IndiaAI as a generative-AI voice-advisory platform from Crop2Cash." }
      - { label: What goes in, text: "A farmer calls an IVR line and speaks a crop or farm-management question in a local dialect." }
      - { label: What comes out, text: "The listing describes transcribed queries and context-specific agricultural advice grounded in an agronomy knowledge base." }
      - { label: Who checks it, text: "The public listing describes safeguards and agronomist review, but does not provide an independent audit in the page reviewed." }
      - { label: How we know, text: "The IndiaAI use-case record describes the interface and deployment; independent user-impact evidence was not located." }
    steps:
      - { role: person, text: "A farmer calls the service and asks a question by voice." }
      - { role: ai, text: "The system transcribes the question and uses its agricultural knowledge base to generate a response, according to the listing." }
      - { role: ai, text: "The IVR returns the advisory through the phone channel." }
      - { role: expert, text: "The listing says agronomists audit answer quality; the frequency and independent results are not established in the reviewed material." }
      - { role: outcome, text: "The use case offers phone-based access to local-language agricultural information, with impact claims still requiring independent evaluation." }
    worked: Phone-based voice access can reduce dependence on reading and smartphone data plans, while retrieval from an agronomy knowledge base can constrain advice.
    limits: The source is a platform listing; no independent study confirming reported adoption, accuracy, or farm outcomes was located.
    sources:
      - { label: IndiaAI FarmAdvice listing, url: "https://aikosh.indiaai.gov.in/home/use-cases/details/farmadvice_closing_the_1_50_000_extension_gap_via_voice_first_ai_advisory.html" }
    clinical: false
    tools:
      - { label: Telephony, text: "A hosted IVR provider such as Twilio or an in-country carrier gateway can accept calls and play recorded or generated responses." }
      - { label: Speech, text: "Benchmark ASR on local dialects and noisy phone audio; provide a repeat or human-transfer option when recognition confidence is low." }
      - { label: Grounded advice, text: "Use a curated retrieval index of extension materials with source citations and escalation for high-risk crop or chemical decisions." }
      - { label: Evaluation, text: "Log anonymized intent, transcription corrections, and expert-rated answer safety rather than relying on satisfaction alone." }
    build_steps:
      - { title: Choose a bounded crop task, detail: "Select one region and crop, gather extension material with permission, and define questions the prototype must refuse or escalate." }
      - { title: Build an IVR flow, detail: "Add language selection, speech capture, confirmation or repeat prompts, and an option to reach an extension worker." }
      - { title: Ground and speak answers, detail: "Retrieve from reviewed agronomy documents, keep responses short, and generate audio only from the verified answer text." }
      - { title: Test locally, detail: "Have farmers and agronomists test dialect recognition, noisy calls, harmful advice cases, and low-connectivity recovery before any pilot." }

- id: c05
  category: [agriculture]
  use_case: Farmer voice-message analysis
  place: Uganda and Mali
  new: false
  reported: 17 February 2026
  figure: "10%"
  figure_note: CGIAR reports a 10% improvement over existing speech-recognition models for Luganda radio speech; the page does not specify the evaluation-set details.
  headline: Longa turns farmer voice messages into usable radio-programme feedback
  who: IFPRI and Farm Radio International, working on low-resource African-language speech recognition
  paragraphs:
    - >-
      IFPRI and Farm Radio International developed Longa to transcribe, translate, and analyse farmers' voice messages from interactive radio projects. The work targets Luganda, primarily spoken in Uganda, and Bambara, primarily spoken in Mali. The partners say the tool can help programme teams make better use of farmer feedback that would otherwise be difficult to analyse at scale. CGIAR reports a 10% improvement over existing speech-recognition models for Luganda radio speech; this is a technical result, not a measured increase in farm yields or income.
  quote: ""
  care: The reported improvement is from the project announcement; the page does not provide a test-set description or independently replicated result. Longa analyses feedback and is not itself a crop-advice authority.
  stamp: Research · Public body
  links:
    - label: CGIAR, 17 Feb 2026
      url: https://www.cgiar.org/news-events/news/ifpri-and-farm-radio-international-collaborate-give-voice-most-vulnerable-farmers
  trace:
    title: Listening to farmer radio messages
    area: Agriculture
    summary: A speech-recognition tool helps radio programme teams transcribe and analyse farmer voice messages in under-served languages.
    facts:
      - { label: The problem, text: "Interactive radio projects receive farmer voice messages, but language barriers make the feedback difficult to process at scale." }
      - { label: AI used, text: "Longa is an IFPRI and Farm Radio International speech-recognition tool for Luganda and Bambara." }
      - { label: What goes in, text: "Farmers' spoken messages submitted through interactive radio projects." }
      - { label: What comes out, text: "Transcriptions, translations, and analysis that can inform agricultural programming." }
      - { label: Who checks it, text: "The project is jointly developed by IFPRI researchers and Farm Radio International's Digital Innovation team; human review remains important for local-language transcription." }
      - { label: How we know, text: "CGIAR reports a 10% improvement over existing models for Luganda radio speech." }
    steps:
      - { role: person, text: "A farmer sends a spoken response through an interactive radio service." }
      - { role: ai, text: "Longa transcribes and translates the message for analysis." }
      - { role: expert, text: "Programme staff review uncertain transcripts and interpret the feedback in local context." }
      - { role: outcome, text: "Radio teams can use the resulting themes to improve agricultural programming and advisory content." }
    worked: The system targets real farmer voice messages and local-language radio audio rather than assuming clean, standard-accent speech.
    limits: The published announcement describes the tool and a reported speech-recognition improvement but does not establish downstream farming outcomes.
    sources:
      - { label: CGIAR / IFPRI / Farm Radio International, url: "https://www.cgiar.org/news-events/news/ifpri-and-farm-radio-international-collaborate-give-voice-most-vulnerable-farmers" }
    clinical: false
    tools:
      - { label: Audio ingestion, text: "A consent-aware pipeline can ingest radio voice messages, normalize sample rate, and preserve the original recording for authorized review." }
      - { label: ASR, text: "Fine-tune a multilingual speech recognizer on reviewed Luganda or Bambara audio; track word error by language and recording condition." }
      - { label: Translation, text: "Keep source-language transcript and translation side by side so bilingual reviewers can correct meaning before analysis." }
      - { label: Human review, text: "Use a lightweight review queue for low-confidence segments and protect speaker identity in dashboards." }
    build_steps:
      - { title: Agree on the feedback loop, detail: "Work with radio partners and farmer groups to define consent, message retention, languages, and how findings will change programming." }
      - { title: Create a reviewed sample, detail: "Transcribe a representative set of messages with bilingual annotators and document dialect, noise, and code-switching." }
      - { title: Fine-tune and measure, detail: "Compare a baseline and adapted ASR model on speaker-separated audio; report word error and human correction time by language." }
      - { title: Route insights safely, detail: "Aggregate themes only after human review, remove identifying details, and send agronomy questions requiring expertise to extension staff." }

- id: c06
  category: [agriculture]
  use_case: Yoruba conversational crop information
  place: Nigeria
  new: false
  reported: 15 September 2026
  figure: Launch
