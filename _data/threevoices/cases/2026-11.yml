      - { label: The problem, text: "Farm information is less accessible when farmers must navigate text-heavy or non-local-language interfaces." }
      - { label: AI used, text: "DataSync Africa announced AGROSYNC as a conversational voice-AI capability for agriculture." }
      - { label: What goes in, text: "A farmer asks an agricultural question through natural voice interaction." }
      - { label: What comes out, text: "The announcement says digital agricultural advisories are available in Yoruba." }
      - { label: Who checks it, text: "The announcement does not describe an independent agronomy review process." }
      - { label: How we know, text: "TechCabal published a partner announcement on 15 September 2026; no independent evaluation is included." }
    steps:
      - { role: person, text: "A farmer asks a crop or farm-management question by voice, as described in the launch announcement." }
      - { role: ai, text: "AGROSYNC processes the spoken request and prepares an agricultural advisory." }
      - { role: ai, text: "The announced service provides the advisory in Yoruba; the article does not specify the speech-generation implementation." }
      - { role: outcome, text: "The launch aims to make agricultural information accessible through Yoruba voice interaction; effectiveness remains unmeasured in the source." }
    worked: A local-language voice channel can reduce the literacy and language barriers of typed advisory services.
    limits: The only source reviewed is a partner announcement; the technical stack, deployment scale, and independent results are not established.
    sources:
      - { label: TechCabal Partner announcement, url: "https://techcabal.com/2026/09/15/datasync-africa-launches-agrosync-yoruba-conversational-voice-ai-for-farmers/" }
    clinical: false
    tools:
      - { label: Voice channel, text: "A mobile web recorder or IVR line can support spoken Yoruba questions without requiring a data-heavy app." }
      - { label: Speech models, text: "Evaluate Yoruba ASR and TTS with local speakers; use a clear replay or correction step when recognition is uncertain." }
      - { label: Agronomy retrieval, text: "Ground answers in reviewed local extension material and attach source references to every advisory." }
      - { label: Safety review, text: "Add an agronomist escalation path for pesticide, animal-health, and high-consequence questions." }
    build_steps:
      - { title: Define the first workflow, detail: "Select a narrow crop and region, and co-design Yoruba prompts with farmers and extension workers." }
      - { title: Test the voice pipeline, detail: "Benchmark ASR and TTS across accents, code-switching, and field noise; let users correct transcripts or ask for repetition." }
      - { title: Ground the answer, detail: "Index approved agricultural guidance, retrieve supporting passages, and refuse advice when the source base is incomplete." }
      - { title: Pilot with safeguards, detail: "Have agronomists review a sample of calls, monitor failure modes, and publish usage and outcome measures before claiming impact." }

- id: c07
  category: [space]
  use_case: Voice-controlled astronaut assistance
  place: International Space Station
  new: false
  reported: 2 March 2018
  figure: ISS demo
  figure_note: ESA reports successful commissioning and Alexander Gerst's first ISS interactions with CIMON; no performance score is reported.
  headline: CIMON gave an astronaut hands-free access to experiment information
  who: ESA astronaut Alexander Gerst and the DLR, Airbus, IBM, and LMU project teams
  paragraphs:
    - >-
      CIMON was a free-flying astronaut assistant tested in the European Columbus module on the International Space Station during the Horizons mission. ESA's video documents successful commissioning and Alexander Gerst's first interactions with it, including help with a procedure; DLR describes voice-controlled access to documents and media. IBM Watson provided speech-understanding AI, while Airbus supplied autonomous navigation and object recognition. It was a technology demonstrator, not a general-purpose autonomous flight operator, and no performance results are reported.
  quote: ""
  care: DLR describes a technology demonstrator and its intended functions. Do not interpret the assistant as authorized to make safety-critical decisions or operate spacecraft systems without crew oversight.
  stamp: Public body
  links:
    - label: DLR, 2 Mar 2018
      url: https://www.dlr.de/en/latest/news/2018/1/20180302_cimon-the-intelligent-astronaut-assistant_26307
    - label: DLR CIMON project page
      url: https://www.dlr.de/en/research-and-transfer/projects-and-missions/horizons/cimon
    - label: ESA video, successful commissioning, 30 Nov 2018
      url: https://www.esa.int/media/horizons-science-cimon
  trace:
    title: Asking a free-flying assistant for experiment instructions
    area: Space technologies
    summary: CIMON used speech AI to provide an astronaut with hands-free access to documents and experiment information.
    facts:
      - { label: The problem, text: "Crew members working with both hands occupied need to retrieve procedure and experiment information efficiently." }
      - { label: AI used, text: "DLR says IBM Watson supplied the speech-understanding AI; Airbus provided separate autonomous navigation and object recognition." }
      - { label: What goes in, text: "Spoken requests captured by microphones on the free-flying assistant." }
      - { label: What comes out, text: "Spoken responses and voice-controlled access to documents and media, alongside on-screen or visual information." }
      - { label: Who checks it, text: "ESA documents astronaut Alexander Gerst's initial interactions during commissioning; sources describe a technology demonstration, not delegated safety-critical authority." }
      - { label: How we know, text: "ESA's 30 November 2018 video documents commissioning and a procedure interaction; DLR's pages describe speech AI and intended functions, with no measured performance." }
    steps:
      - { role: person, text: "During CIMON's documented initial ISS outing, ESA astronaut Alexander Gerst interacted with the assistant in the Columbus module." }
      - { role: ai, text: "CIMON's microphones and IBM Watson speech AI process the spoken request." }
      - { role: ai, text: "ESA reports that CIMON helped with a procedure and played music during the demonstration." }
      - { role: person, text: "The astronaut remained responsible for carrying out the procedure." }
      - { role: outcome, text: "The commissioning demonstrated voice interaction in orbit; sources report no operational safety-performance metric." }
    worked: Speech access and a mobile display allow an astronaut to retrieve documents without stopping a hands-on task.
    limits: Technology demonstration only; the page does not establish the reliability needed for unsupervised or safety-critical procedure execution.
    sources:
      - { label: DLR news, url: "https://www.dlr.de/en/latest/news/2018/1/20180302_cimon-the-intelligent-astronaut-assistant_26307" }
      - { label: DLR project page, url: "https://www.dlr.de/en/research-and-transfer/projects-and-missions/horizons/cimon" }
      - { label: ESA video, url: "https://www.esa.int/media/horizons-science-cimon" }
    clinical: false
    tools:
      - { label: Audio capture, text: "Use a close-talk or directional microphone array with push-to-talk and crew-controlled mute to reduce background speech." }
      - { label: Speech understanding, text: "A speech recognizer and bounded intent model can map crew requests to approved document searches." }
      - { label: Procedure retrieval, text: "Index version-controlled procedure documents and return the exact source section with every spoken answer." }
      - { label: Output and control, text: "Use a speaker plus a visual display, with a physical stop and explicit confirmation before any external action." }
    build_steps:
      - { title: Choose low-risk requests, detail: "Start with read-only information retrieval, such as locating an experiment document; exclude commands that change vehicle state." }
      - { title: Build voice retrieval, detail: "Capture speech, confirm ambiguous terms, retrieve from approved documents, and speak only a short answer with a displayed citation." }
      - { title: Test in a noisy mock-up, detail: "Evaluate recognition and interruption behavior with fans, masks, and overlapping crew speech; provide a text or manual fallback." }
      - { title: Keep crew in control, detail: "Require crew review for procedure steps, log sources and version identifiers, and fail closed when a document cannot be verified." }

- id: c08
  category: [space]
  use_case: Digital voice assistant for ISS crew operations
  place: International Space Station
  new: false
  reported: Undated Axiom Space project record, accessed 24 November 2026
  figure: Demonstration
  figure_note: Axiom describes evaluation on Ax-2 and Ax-3 and captions an Ax-3 photo as an Amazon Echo technology demonstration; it gives no measured performance result.
  headline: Axiom's Digital Voice Assistant explored voice support for station tasks
  who: Axiom Space and private astronaut mission crews on Ax-2 and Ax-3
  paragraphs:
    - >-
      Axiom Space describes a Digital Voice Assistant investigation intended to support crew operations on the International Space Station and inform a future smart-spacecraft ecosystem. The project record describes evaluation through private astronaut missions Ax-2 and Ax-3 and captions an Ax-3 photo as an Amazon Echo technology demonstration. The described device connects over the station network to a cloud service, and its operating time and location are constrained to address crew privacy and awareness. The page does not publish a measured outcome or enough detail to identify the assistant's AI model.
  quote: ""
  care: The project page describes an investigation and planned evaluation, not a validated operational assistant. The cloud connection and privacy constraints are important design limitations for future missions.
  stamp: Organization
  links:
    - label: Axiom Space, Digital Voice Assistant investigation
      url: https://www.axiomspace.com/research/digital-voice-assistant
  trace:
    title: Calling a station voice assistant during a bounded demo
    area: Space technologies
    summary: Axiom's investigation describes a voice assistant demonstration for crew operations with constraints on when and where it could run.
    facts:
      - { label: The problem, text: "Future crews may benefit from hands-free access to station information and tasks." }
      - { label: AI used, text: "Axiom describes a Digital Voice Assistant device and cloud service; its Ax-3 photo caption identifies an Amazon Echo demonstration, but the record does not identify the assistant's AI model." }
      - { label: What goes in, text: "Crew speech captured by the device during a scheduled, authorized demonstration window." }
      - { label: What comes out, text: "Voice-assistant responses intended to support crew operations; the page does not specify every supported task." }
      - { label: Who checks it, text: "Axiom's page describes a planned evaluation on Ax-2 and Ax-3 and captions an Ax-3 Echo demonstration; it specifies time and location limits for privacy." }
      - { label: How we know, text: "Axiom's investigation page describes the Ax-2/Ax-3 scope, network path, and Ax-3 demonstration photo; it provides no performance results." }
    steps:
      - { role: person, text: "A crew member uses the assistant only during an authorized demonstration period and location." }
      - { role: ai, text: "The device sends the voice request over station Wi-Fi and the station network to a cloud service." }
      - { role: ai, text: "The service returns a voice-assistant response to the crew device." }
      - { role: expert, text: "The investigation constrains device use to address crew privacy and situational awareness." }
      - { role: outcome, text: "The investigation explores station-task support, but the project page reports no measured effectiveness." }
    worked: The investigation explicitly treats privacy and crew awareness as operational requirements rather than assuming an always-listening assistant is acceptable.
    limits: Public material does not identify the model, task-level accuracy, or operational benefit; cloud connectivity may not suit deep-space missions.
    sources:
      - { label: Axiom Space DVA project page, url: "https://www.axiomspace.com/research/digital-voice-assistant" }
    clinical: false
    tools:
      - { label: Voice interface, text: "A push-to-talk device with visible mute and session indicators is safer to prototype than continuous listening." }
      - { label: Speech services, text: "A prototype may use ASR and TTS services, but must be benchmarked under station noise and communication constraints." }
      - { label: Network boundary, text: "Model the station-to-cloud path explicitly and test offline failure behavior before considering an on-board use." }
      - { label: Privacy controls, text: "Use crew-selected activation windows, no raw-audio retention by default, and auditable access controls." }
    build_steps:
      - { title: Limit the task set, detail: "Select read-only crew information requests and document exactly which calls leave the local device." }
      - { title: Prototype push-to-talk, detail: "Build an explicit activation control, on-screen listening indicator, short-turn ASR, and spoken response with a cancel action." }
      - { title: Simulate the network, detail: "Test latency, dropped links, and disconnected mode; show an honest unavailable state rather than inventing a response." }
      - { title: Evaluate crew factors, detail: "Run usability tests in a noisy mock environment with crew representatives, focusing on distraction, privacy, and recovery from errors." }

- id: c09
  category: [space]
  use_case: Voice-supported spaceflight procedures
  place: ISS and Lunar Gateway mission concepts
  new: false
  reported: 21 September 2024
  figure: "10 procedures"
  figure_note: The prototype indexed ten public procedures and tested spoken questions; it was not flight-tested and has no reported performance score.
  headline: Researchers tested a voice assistant prototype on spaceflight procedures
  who: German Aerospace Center and European Space Agency researchers, with University of Washington collaborators
  paragraphs:
    - >-
      Researchers describe CORE, an intelligent assistant prototype for astronaut procedures. Their initial experiments indexed ten publicly available procedures and combined Whisper speech recognition, GPT-4 retrieval-augmented generation, and ArangoDB/Elasticsearch data stores. In tests, the system returned procedure steps in response to spoken questions; the broader design proposes offline operation and augmented-reality cues. It was not tested in space, and the paper reports no quantified performance score.
  quote: ""
  care: This is an early research prototype reported in an ESA SPAICE 2024 conference paper, not evidence of an operational or flight-tested assistant. Procedure answers would require validation against controlled source documents.
  stamp: Research
  links:
    - label: arXiv, submitted 21 Sep 2024
      url: https://arxiv.org/abs/2409.14206
    - label: arXiv full text
      url: https://arxiv.org/html/2409.14206v1
  trace:
    title: Testing a voice query against spaceflight procedures
    area: Space technologies
    summary: CORE is a voice-enabled research prototype that retrieved procedure steps from a small set of astronaut documents.
    facts:
      - { label: The problem, text: "Future lunar missions may experience communication blackouts that limit real-time support from mission control." }
      - { label: AI used, text: "The initial prototype used Whisper for speech recognition, GPT-4 with retrieval-augmented generation, Elasticsearch retrieval, and an ArangoDB graph database." }
      - { label: What goes in, text: "A spoken question about one of ten publicly available astronaut procedures." }
      - { label: What comes out, text: "A retrieved procedure step returned by the assistant; the paper also proposes future AR visual cues and offline operation." }
      - { label: Who checks it, text: "The authors tested question responses against the indexed procedures; no crew safety or in-space validation is reported." }
      - { label: How we know, text: "The arXiv paper submitted 21 September 2024 describes initial experiments on ten public procedures and was accepted for the ESA SPAICE Conference 2024." }
    steps:
      - { role: person, text: "In the reported prototype test, a user asks a spoken question about one of the indexed procedures." }
      - { role: ai, text: "Whisper converts the speech query to text, and retrieval selects relevant procedure information." }
      - { role: ai, text: "GPT-4 returns an answer grounded in the retrieved step and linked procedure data." }
      - { role: expert, text: "The authors check responses against procedure content; mission use would require additional crew and safety validation." }
      - { role: outcome, text: "The paper reports initial prototype experiments, not an in-flight deployment or a quantified performance evaluation." }
    worked: The prototype combined speech recognition with retrieval from a bounded collection of procedure documents and related graph data.
    limits: No flight deployment or quantified safety evaluation is reported; AI-generated procedure guidance must not replace approved checklists or crew judgment.
    sources:
      - { label: arXiv paper, url: "https://arxiv.org/abs/2409.14206" }
      - { label: CORE full text, url: "https://arxiv.org/html/2409.14206v1" }
    clinical: false
    tools:
      - { label: Speech recognition, text: "The reported prototype used Whisper to convert spoken questions into text." }
      - { label: Procedure retrieval, text: "The experiment used GPT-4 with retrieval-augmented generation and an Elasticsearch vector index." }
      - { label: Knowledge graph, text: "The authors used ArangoDB to connect procedures with metadata and related images." }
      - { label: Offline and AR, text: "Cache a signed procedure bundle and show the retrieved step in a headset or tablet interface when disconnected." }
    build_steps:
      - { title: Select a safe procedure, detail: "Use a non-critical training checklist with authorized documents and a clear version identifier." }
      - { title: Build grounded retrieval, detail: "Create the procedure graph and local index; return source text and refuse when the retrieval result is incomplete." }
      - { title: Add voice and visual cues, detail: "Add push-to-talk input, spoken read-back, and an AR or tablet display that keeps the official step visible." }
      - { title: Test offline and fail-safe behavior, detail: "Simulate communication loss and ambiguous requests; require crew confirmation, log document versions, and never let the model execute a physical action." }
